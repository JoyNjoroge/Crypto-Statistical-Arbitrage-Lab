[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crypto-stat-arb-lab"
version = "1.1.0"
description = "Reproducible crypto pairs trading research: cointegration, execution-aware backtesting and robustness"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Joy Njoroge"}]
keywords = ["statistical-arbitrage", "pairs-trading", "cointegration", "backtesting", "crypto", "quant-research"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Financial and Insurance Industry",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Office/Business :: Financial :: Investment",
  "Topic :: Scientific/Engineering",
  "Typing :: Typed",
]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.2",
  "statsmodels>=0.14",
  "requests>=2.31",
  "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4",
  "pytest-cov>=4.1",
  "ruff>=0.5",
  "mypy>=1.10",
  "pandas-stubs>=2.2",
  "types-requests>=2.31",
  "build>=1.2",
  "twine>=5.0",
]
notebook = ["jupyter>=1.0"]

[project.scripts]
crypto-stat-arb = "crypto_stat_arb.cli:main"
crypto-stat-arb-paper = "crypto_stat_arb.paper:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
crypto_stat_arb = ["py.typed"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov=crypto_stat_arb --cov-report=term-missing --cov-fail-under=90"
filterwarnings = ["error::DeprecationWarning:crypto_stat_arb"]
markers = ["network: tests that would need internet access (deselected by default)"]

[tool.coverage.run]
branch = true
source = ["crypto_stat_arb"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if __name__ == .__main__.:", "raise SystemExit"]

[tool.ruff]
line-length = 105
target-version = "py310"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C4", "RUF", "SIM", "PT", "N"]
ignore = ["E741", "RUF012"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PT011"]

[tool.ruff.lint.isort]
known-first-party = ["crypto_stat_arb"]

[tool.mypy]
python_version = "3.10"
files = ["src"]
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = false
check_untyped_defs = true
no_implicit_optional = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["statsmodels.*", "matplotlib.*"]
ignore_missing_imports = true
